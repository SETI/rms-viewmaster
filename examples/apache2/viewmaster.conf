# Minimal Apache 2.4 + mod_wsgi vhost for Viewmaster and the Link service.
#
# Prerequisites:
#   - mod_wsgi enabled
#   - A virtualenv with this project's requirements.txt installed
#     (`pip install -r requirements.txt`). Add extras [memcache] for pylibmc.
#   - PDS3_HOLDINGS_DIR and VIEWMASTER_SECRET_KEY in the Apache process
#     environment (os.environ). Optionally PDS4_HOLDINGS_DIR and
#     VIEWMASTER_LOG_DIR. Set them in /etc/apache2/envvars (Debian)
#     or a systemd drop-in (Environment=/EnvironmentFile=). Do not rely on
#     SetEnv — create_app() reads os.getenv() at startup.
#   - Do not set VIEWMASTER_TESTING in production.
#
# python-home replaces the old wsgi_init.py venv bootstrap. The WSGI files
# (viewmaster.wsgi, link.wsgi) are two-line factories; create_app() handles
# all startup (logger, holdings, page cache, icons, Pds3File/Pds4File preload).
#
# Copy this file, replace the /path/to/* placeholders, and enable the site.

<VirtualHost *:80>
    ServerName pds-rings.seti.org

    WSGIDaemonProcess viewmaster \
        python-home=/path/to/venv \
        python-path=/path/to/rms-viewmaster \
        processes=2 \
        threads=5 \
        display-name=%{GROUP}

    WSGIDaemonProcess viewmaster-link \
        python-home=/path/to/venv \
        python-path=/path/to/rms-viewmaster \
        processes=1 \
        threads=5 \
        display-name=%{GROUP}

    WSGIScriptAlias /viewmaster /path/to/rms-viewmaster/viewmaster.wsgi \
        process-group=viewmaster application-group=%{GLOBAL}
    WSGIScriptAlias /link /path/to/rms-viewmaster/link.wsgi \
        process-group=viewmaster-link application-group=%{GLOBAL}

    <Directory /path/to/rms-viewmaster>
        Require all granted
    </Directory>
</VirtualHost>
