[build-system]
requires = ["setuptools>=68", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-viewmaster"
dynamic = ["version"]
description = "Web-based file and document viewer for PDS holdings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
maintainers = [
    {name = "Robert S. French", email = "rfrench@seti.org"}
]
keywords = ["viewmaster", "pds", "pds3", "pds4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "flask>=3.0",
    "flask-wtf>=1.2",
    "psutil>=5.9",
    "rms-pdsfile",
    "rms-pdslogger>=3.1.1",
    "rms-pdstable",
    "rms-translator",
]

[project.optional-dependencies]
memcache = [
    "pylibmc==1.6.3",
]
dev = [
    "pytest==9.1.1",
    "myst-parser==5.1.0",
    "sphinx==9.1.0",
    "sphinx-rtd-theme==3.1.0",
]

[project.scripts]
viewmaster = "viewmaster.viewmaster:main"

[project.urls]
Homepage = "https://github.com/SETI/rms-viewmaster"
Repository = "https://github.com/SETI/rms-viewmaster"
Documentation = "https://rms-viewmaster.readthedocs.io/en/latest/"
Issues = "https://github.com/SETI/rms-viewmaster/issues"

[tool.setuptools.packages.find]
include = ["viewmaster*"]

[tool.setuptools.package-data]
viewmaster = ["templates/*.html"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
